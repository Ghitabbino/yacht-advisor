<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Rosa dei venti Yacht Advisor">
  <!-- Fondo trasparente -->
  <!-- Cerchi esterni doppi -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#0F172A" stroke-width="1.2" opacity="0.9"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.5"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#0F172A" stroke-width="0.35" opacity="0.2"/>
  <!-- Rombi di fondo 16 punte secondarie -->
  <g opacity="0.9">
    <!-- NORD - giglio stilizzato + punta lunga oro -->
    <g id="nord">
      <path d="M100 14 L106 42 L100 52 L94 42 Z" fill="#D4AF37" stroke="#0F172A" stroke-width="0.7"/>
      <path d="M100 14 L102 26 L100 32 L98 26 Z" fill="#FDFCFB"/>
      <!-- giglio centrale -->
      <path d="M100 34 C98 38 94 40 94 44 C94 47 97 49 100 49 C103 49 106 47 106 44 C106 40 102 38 100 34 Z" fill="#0F172A" stroke="#D4AF37" stroke-width="0.5"/>
      <path d="M100 34 L100 49" stroke="#D4AF37" stroke-width="0.4"/>
    </g>
    <!-- SUD -->
    <path d="M100 186 L94 158 L100 148 L106 158 Z" fill="#0F172A" stroke="#D4AF37" stroke-width="0.6"/>
    <!-- EST -->
    <path d="M186 100 L158 94 L148 100 L158 106 Z" fill="#0F172A" stroke="#D4AF37" stroke-width="0.6"/>
    <!-- OVEST -->
    <path d="M14 100 L42 106 L52 100 L42 94 Z" fill="#0F172A" stroke="#D4AF37" stroke-width="0.6"/>
    <!-- NE - SE - SW - NW intermedie (8 punte) -->
    <g fill="#0F172A" stroke="#D4AF37" stroke-width="0.5">
      <path d="M158 42 L145 58 L138 64 L152 52 Z" />
      <path d="M158 158 L152 148 L138 136 L145 142 Z" />
      <path d="M42 158 L55 142 L62 136 L48 148 Z" />
      <path d="M42 42 L48 52 L62 64 L55 58 Z" />
    </g>
    <!-- 8 punte secondarie più corte (NNE, ENE, ESE, SSE, SSW, WSW, WNW, NNW) -->
    <g fill="none" stroke="#0F172A" stroke-width="0.7" opacity="0.85">
      <path d="M127 28 L122 46 L118 52 L114 46 Z" fill="#FDFCFB" stroke="#0F172A"/>
      <path d="M172 73 L154 78 L148 82 L154 86 Z" fill="#FDFCFB" stroke="#0F172A"/>
      <path d="M172 127 L154 122 L148 118 L154 114 Z" fill="#FDFCFB" stroke="#0F172A"/>
      <path d="M127 172 L122 154 L118 148 L114 154 Z" fill="#FDFCFB" stroke="#0F172A"/>
      <path d="M73 172 L78 154 L82 148 L86 154 Z" fill="#FDFCFB" stroke="#0F172A"/>
      <path d="M28 127 L46 122 L52 118 L46 114 Z" fill="#FDFCFB" stroke="#0F172A"/>
      <path d="M28 73 L46 78 L52 82 L46 86 Z" fill="#FDFCFB" stroke="#0F172A"/>
      <path d="M73 28 L78 46 L82 52 L86 46 Z" fill="#FDFCFB" stroke="#0F172A"/>
    </g>
    <!-- Stella centrale 8 punte -->
    <g fill="#0F172A" stroke="#D4AF37" stroke-width="0.6">
      <polygon points="100,68 105,88 100,100 95,88" />
      <polygon points="132,100 112,105 100,100 112,95" />
      <polygon points="100,132 95,112 100,100 105,112" />
      <polygon points="68,100 88,95 100,100 88,105" />
      <!-- diagonali centrali sottili oro -->
      <polygon points="122,78 112,88 100,100 112,88" fill="#D4AF37" stroke="none" opacity="0.9"/>
      <polygon points="122,122 112,112 100,100 112,112" fill="#D4AF37" stroke="none" opacity="0.9"/>
      <polygon points="78,122 88,112 100,100 88,112" fill="#D4AF37" stroke="none" opacity="0.9"/>
      <polygon points="78,78 88,88 100,100 88,88" fill="#D4AF37" stroke="none" opacity="0.9"/>
    </g>
    <!-- Cerchio centrale -->
    <circle cx="100" cy="100" r="7" fill="#D4AF37" stroke="#0F172A" stroke-width="0.8"/>
    <circle cx="100" cy="100" r="2.5" fill="#FDFCFB"/>
  </g>
  <!-- Lettere cardinali -->
  <g font-family="Cinzel, serif" font-weight="700" text-anchor="middle">
    <text x="100" y="11" font-size="13" fill="#0F172A">N</text>
    <text x="100" y="196" font-size="10" fill="#0F172A">S</text>
    <text x="190" y="104" font-size="10" fill="#0F172A">E</text>
    <text x="10" y="104" font-size="10" fill="#0F172A">W</text>
  </g>
</svg>
